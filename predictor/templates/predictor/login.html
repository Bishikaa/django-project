{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — StudyWise</title>
    <link rel="stylesheet" href="{% static 'predictor/css/forms.css' %}">
</head>
<body>
    <div class="center-page">
        <div class="auth-brand">
            <div class="brand-logo">StudyWise</div>
            <div class="brand-tagline">Build better study habits, one session at a time.</div>
        </div>
        <div class="card">
            <div class="auth-header">
                <h1>Welcome back</h1>
                <p class="subtitle">Log in to continue tracking your study habits.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Log in</button>
            </form>
            <div class="switch">No account? <a href="{% url 'signup' %}">Sign up</a></div>
        </div>
    </div>
</body>
</html>
