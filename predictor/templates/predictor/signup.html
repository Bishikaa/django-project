{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — StudyWise</title>
    <link rel="stylesheet" href="{% static 'predictor/css/forms.css' %}">
</head>
<body>
    <div class="center-page">
        <div class="card">
            <h1>🌿 Create your account</h1>
            <p class="subtitle">Start understanding your own study patterns</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Sign Up</button>
            </form>
            <div class="switch">Already have an account? <a href="{% url 'login' %}">Login</a></div>
        </div>
    </div>
</body>
</html>
